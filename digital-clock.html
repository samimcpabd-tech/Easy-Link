<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Clock - Multiple Time Zones</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Courier New', monospace;
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: #fff;
}

.container {
  max-width: 1200px;
  width: 100%;
}

.header {
  text-align: center;
  margin-bottom: 50px;
}

.header h1 {
  font-size: 2.5rem;
  margin-bottom: 10px;
  background: linear-gradient(45deg, #00d4ff, #0099ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header p {
  font-size: 1rem;
  color: #aaa;
}

.clocks-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 30px;
  margin-bottom: 40px;
}

.clock-card {
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  padding: 30px;
  text-align: center;
  transition: all 0.3s ease;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
}

.clock-card:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(0, 212, 255, 0.3);
  transform: translateY(-5px);
  box-shadow: 0 12px 40px rgba(0, 212, 255, 0.2);
}

.timezone-name {
  font-size: 1.3rem;
  font-weight: bold;
  color: #00d4ff;
  margin-bottom: 15px;
  text-transform: uppercase;
  letter-spacing: 2px;
}

.digital-time {
  font-size: 2.5rem;
  font-weight: bold;
  background: linear-gradient(45deg, #00d4ff, #0099ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 10px;
  font-family: 'Courier New', monospace;
  letter-spacing: 3px;
}

.date-info {
  font-size: 0.9rem;
  color: #aaa;
  margin-bottom: 15px;
}

.timezone-offset {
  font-size: 0.85rem;
  color: #888;
  background: rgba(0, 212, 255, 0.1);
  padding: 8px 12px;
  border-radius: 8px;
  display: inline-block;
}

.analog-clock {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.2);
  border: 3px solid #00d4ff;
  position: relative;
  margin: 20px auto;
  box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
}

.clock-center {
  width: 12px;
  height: 12px;
  background: #00d4ff;
  border-radius: 50%;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 10;
}

.hand {
  position: absolute;
  bottom: 50%;
  left: 50%;
  transform-origin: bottom center;
  background: #00d4ff;
  border-radius: 10px;
}

.hour-hand {
  width: 4px;
  height: 40px;
  margin-left: -2px;
  background: #0099ff;
}

.minute-hand {
  width: 3px;
  height: 50px;
  margin-left: -1.5px;
  background: #00d4ff;
}

.second-hand {
  width: 2px;
  height: 55px;
  margin-left: -1px;
  background: #ff006e;
}

.clock-number {
  position: absolute;
  width: 100%;
  height: 100%;
  text-align: center;
  font-size: 0.9rem;
  font-weight: bold;
  color: #00d4ff;
}

.clock-number span {
  display: inline-block;
  position: absolute;
  left: 50%;
  width: 20px;
  margin-left: -10px;
}

/* Clock numbers positions */
.num-12 { top: 8px; }
.num-3 { right: 8px; top: 50%; transform: translateY(-50%); }
.num-6 { bottom: 8px; }
.num-9 { left: 8px; top: 50%; transform: translateY(-50%); }

.controls {
  text-align: center;
  margin-top: 40px;
  padding: 30px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 15px;
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.controls h3 {
  margin-bottom: 20px;
  color: #00d4ff;
  font-size: 1.2rem;
}

.button-group {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
}

button {
  background: linear-gradient(45deg, #00d4ff, #0099ff);
  color: #000;
  border: none;
  padding: 10px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  font-size: 0.9rem;
  transition: all 0.3s ease;
  text-transform: uppercase;
  letter-spacing: 1px;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
}

button:active {
  transform: scale(0.98);
}

.timezone-select {
  padding: 10px 15px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.1);
  color: #00d4ff;
  border: 1px solid rgba(0, 212, 255, 0.3);
  font-size: 0.9rem;
  cursor: pointer;
  margin-top: 20px;
}

.timezone-select option {
  background: #0f0c29;
  color: #00d4ff;
}

@media (max-width: 768px) {
  .header h1 {
    font-size: 1.8rem;
  }

  .digital-time {
    font-size: 2rem;
  }

  .clocks-grid {
    grid-template-columns: 1fr;
  }

  .analog-clock {
    width: 120px;
    height: 120px;
  }
}

@keyframes tick {
  0% { opacity: 0.7; }
  50% { opacity: 1; }
  100% { opacity: 0.7; }
}

.update-indicator {
  display: inline-block;
  width: 8px;
  height: 8px;
  background: #ff006e;
  border-radius: 50%;
  animation: tick 1s infinite;
  margin-left: 10px;
  vertical-align: middle;
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>⏰ Digital Clock</h1>
    <p>Real-time display across multiple time zones</p>
  </div>

  <div class="clocks-grid" id="clocksGrid">
    <!-- Clocks will be generated here -->
  </div>

  <div class="controls">
    <h3>Add Custom Time Zone</h3>
    <select id="timezoneSelect" class="timezone-select">
      <option value="">Select a time zone...</option>
      <option value="America/New_York">New York (EST/EDT)</option>
      <option value="America/Chicago">Chicago (CST/CDT)</option>
      <option value="America/Denver">Denver (MST/MDT)</option>
      <option value="America/Los_Angeles">Los Angeles (PST/PDT)</option>
      <option value="Europe/London">London (GMT/BST)</option>
      <option value="Europe/Paris">Paris (CET/CEST)</option>
      <option value="Europe/Berlin">Berlin (CET/CEST)</option>
      <option value="Asia/Tokyo">Tokyo (JST)</option>
      <option value="Asia/Shanghai">Shanghai (CST)</option>
      <option value="Asia/Hong_Kong">Hong Kong (HKT)</option>
      <option value="Asia/Singapore">Singapore (SGT)</option>
      <option value="Asia/Dubai">Dubai (GST)</option>
      <option value="Asia/Kolkata">India (IST)</option>
      <option value="Australia/Sydney">Sydney (AEDT/AEST)</option>
      <option value="Pacific/Auckland">Auckland (NZDT/NZST)</option>
    </select>
    <br>
    <div class="button-group" style="margin-top: 20px;">
      <button onclick="addTimezone()">Add Time Zone</button>
      <button onclick="resetClocks()" style="background: linear-gradient(45deg, #ff006e, #ff4060);">Reset</button>
    </div>
  </div>
</div>

<script>
// Default time zones
const defaultTimezones = [
  'America/New_York',
  'Europe/London',
  'Asia/Tokyo',
  'Australia/Sydney'
];

let activeTimezones = [...defaultTimezones];

// Format time with leading zeros
function formatTime(date) {
  const hours = String(date.getHours()).padStart(2, '0');
  const minutes = String(date.getMinutes()).padStart(2, '0');
  const seconds = String(date.getSeconds()).padStart(2, '0');
  return `${hours}:${minutes}:${seconds}`;
}

// Get timezone abbreviation and offset
function getTimezoneInfo(timezone) {
  const formatter = new Intl.DateTimeFormat('en-US', {
    timeZone: timezone,
    timeZoneName: 'short'
  });
  const parts = formatter.formatToParts(new Date());
  const tzName = parts.find(p => p.type === 'timeZoneName')?.value || 'UTC';
  
  // Calculate offset
  const now = new Date();
  const utcDate = new Date(now.toLocaleString('en-US', { timeZone: 'UTC' }));
  const tzDate = new Date(now.toLocaleString('en-US', { timeZone: timezone }));
  const offset = (tzDate - utcDate) / (1000 * 60 * 60);
  const offsetStr = offset >= 0 ? `UTC+${offset}` : `UTC${offset}`;
  
  return { tzName, offsetStr };
}

// Get time in specific timezone
function getTimeInTimezone(timezone) {
  const date = new Date();
  const options = { timeZone: timezone };
  const localString = date.toLocaleString('en-US', options);
  return new Date(localString);
}

// Get timezone name from identifier
function getTimezoneDisplayName(timezone) {
  return timezone.split('/').pop().replace(/_/g, ' ');
}

// Create clock HTML
function createClockHTML(timezone) {
  const displayName = getTimezoneDisplayName(timezone);
  const { tzName, offsetStr } = getTimezoneInfo(timezone);
  const tzDate = getTimeInTimezone(timezone);
  const timeString = formatTime(tzDate);
  const dateString = tzDate.toLocaleDateString('en-US', { 
    weekday: 'short', 
    month: 'short', 
    day: 'numeric', 
    year: 'numeric' 
  });

  return `
    <div class="clock-card" data-timezone="${timezone}">
      <div class="timezone-name">${displayName}</div>
      <div class="analog-clock">
        <div class="clock-center"></div>
        <div class="hand hour-hand" style="transform: rotate(${tzDate.getHours() % 12 * 30 + tzDate.getMinutes() / 2}deg);"></div>
        <div class="hand minute-hand" style="transform: rotate(${tzDate.getMinutes() * 6 + tzDate.getSeconds() / 10}deg);"></div>
        <div class="hand second-hand" style="transform: rotate(${tzDate.getSeconds() * 6}deg);"></div>
        <div class="clock-number">
          <span class="num-12">12</span>
          <span class="num-3">3</span>
          <span class="num-6">6</span>
          <span class="num-9">9</span>
        </div>
      </div>
      <div class="digital-time">${timeString}</div>
      <div class="date-info">${dateString}</div>
      <div class="timezone-offset">${offsetStr}</div>
    </div>
  `;
}

// Render all clocks
function renderClocks() {
  const grid = document.getElementById('clocksGrid');
  grid.innerHTML = activeTimezones.map(tz => createClockHTML(tz)).join('');
}

// Update all clocks
function updateClocks() {
  activeTimezones.forEach(timezone => {
    const card = document.querySelector(`[data-timezone="${timezone}"]`);
    if (card) {
      const tzDate = getTimeInTimezone(timezone);
      
      // Update digital time
      const timeDisplay = card.querySelector('.digital-time');
      timeDisplay.textContent = formatTime(tzDate);
      
      // Update date
      const dateDisplay = card.querySelector('.date-info');
      dateDisplay.textContent = tzDate.toLocaleDateString('en-US', { 
        weekday: 'short', 
        month: 'short', 
        day: 'numeric', 
        year: 'numeric' 
      });
      
      // Update analog clock hands
      const hourHand = card.querySelector('.hour-hand');
      const minuteHand = card.querySelector('.minute-hand');
      const secondHand = card.querySelector('.second-hand');
      
      hourHand.style.transform = `rotate(${tzDate.getHours() % 12 * 30 + tzDate.getMinutes() / 2}deg)`;
      minuteHand.style.transform = `rotate(${tzDate.getMinutes() * 6 + tzDate.getSeconds() / 10}deg)`;
      secondHand.style.transform = `rotate(${tzDate.getSeconds() * 6}deg)`;
    }
  });
}

// Add timezone
function addTimezone() {
  const select = document.getElementById('timezoneSelect');
  const timezone = select.value;
  
  if (!timezone) {
    alert('Please select a time zone');
    return;
  }
  
  if (activeTimezones.includes(timezone)) {
    alert('This time zone is already displayed');
    return;
  }
  
  activeTimezones.push(timezone);
  renderClocks();
  select.value = '';
}

// Reset to default
function resetClocks() {
  activeTimezones = [...defaultTimezones];
  renderClocks();
  document.getElementById('timezoneSelect').value = '';
}

// Initialize
renderClocks();
setInterval(updateClocks, 1000);
</script>

</body>
</html>
